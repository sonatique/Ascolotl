<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdocForge Icon Preview — Illustrated / Cartoon</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1C1B1A;
    color: #E0DDD8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 40px 24px;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: #F5E6D8;
  }
  .subtitle {
    text-align: center;
    font-size: 0.9rem;
    color: #8A8580;
    margin-bottom: 48px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: center;
    gap: 36px;
  }
  .icon-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .icon-cell .size-label {
    font-size: 0.75rem;
    color: #8A8580;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<h1>Illustrated / Cartoon</h1>
<p class="subtitle">Soft gradients, gentle shading, friendly rounded shapes</p>

<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <!-- Gradients for illustrated style -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#3A3530"/>
      <stop offset="100%" stop-color="#2A2724"/>
    </radialGradient>

    <linearGradient id="gill-grad-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C44070"/>
      <stop offset="100%" stop-color="#F0A0B8"/>
    </linearGradient>
    <linearGradient id="gill-grad-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C44070"/>
      <stop offset="100%" stop-color="#F0A0B8"/>
    </linearGradient>
    <linearGradient id="gill-tip-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E85B8A"/>
      <stop offset="100%" stop-color="#F5C0D0"/>
    </linearGradient>
    <linearGradient id="gill-tip-r" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E85B8A"/>
      <stop offset="100%" stop-color="#F5C0D0"/>
    </linearGradient>

    <radialGradient id="face-grad" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FFFAF6"/>
      <stop offset="70%" stop-color="#F5E6D8"/>
      <stop offset="100%" stop-color="#EDD5C4"/>
    </radialGradient>

    <radialGradient id="chin-grad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#F5D0BC"/>
      <stop offset="100%" stop-color="#EABC9E"/>
    </radialGradient>

    <radialGradient id="eye-grad" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#3A3430"/>
      <stop offset="100%" stop-color="#1A1815"/>
    </radialGradient>

    <!-- Soft shadow filter -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="gill-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8"/>
    </filter>

    <symbol id="axolotl-illustrated" viewBox="0 0 64 64">
      <!-- Background circle with subtle gradient -->
      <circle cx="32" cy="32" r="30" fill="url(#bg-grad)"/>

      <!-- Soft shadow under face -->
      <ellipse cx="32" cy="44" rx="16" ry="6" fill="#1A1815" opacity="0.15"/>

      <!-- LEFT GILLS — layered feathery branches -->
      <!-- Main branches -->
      <ellipse cx="10" cy="17" rx="5.5" ry="2" transform="rotate(-50 10 17)" fill="url(#gill-grad-l)"/>
      <ellipse cx="7"  cy="24" rx="6"   ry="2.2" transform="rotate(-22 7 24)"  fill="url(#gill-grad-l)"/>
      <ellipse cx="8"  cy="31" rx="5.5" ry="2" transform="rotate(8 8 31)"     fill="url(#gill-grad-l)"/>
      <!-- Secondary thinner branches -->
      <ellipse cx="12" cy="13" rx="4" ry="1.3" transform="rotate(-62 12 13)" fill="url(#gill-tip-l)"/>
      <ellipse cx="6"  cy="20" rx="4" ry="1.2" transform="rotate(-35 6 20)"  fill="url(#gill-tip-l)"/>
      <ellipse cx="5"  cy="28" rx="3.5" ry="1.1" transform="rotate(-8 5 28)" fill="url(#gill-tip-l)"/>
      <ellipse cx="10" cy="34" rx="3" ry="1" transform="rotate(20 10 34)"    fill="url(#gill-tip-l)"/>
      <!-- Tiny tips -->
      <ellipse cx="8"  cy="14" rx="2" ry="0.7" transform="rotate(-55 8 14)"  fill="#F5C0D0" opacity="0.7"/>
      <ellipse cx="4"  cy="23" rx="2.5" ry="0.7" transform="rotate(-20 4 23)" fill="#F5C0D0" opacity="0.7"/>

      <!-- RIGHT GILLS — mirrored -->
      <ellipse cx="54" cy="17" rx="5.5" ry="2" transform="rotate(50 54 17)"  fill="url(#gill-grad-r)"/>
      <ellipse cx="57" cy="24" rx="6"   ry="2.2" transform="rotate(22 57 24)" fill="url(#gill-grad-r)"/>
      <ellipse cx="56" cy="31" rx="5.5" ry="2" transform="rotate(-8 56 31)"  fill="url(#gill-grad-r)"/>
      <ellipse cx="52" cy="13" rx="4" ry="1.3" transform="rotate(62 52 13)"  fill="url(#gill-tip-r)"/>
      <ellipse cx="58" cy="20" rx="4" ry="1.2" transform="rotate(35 58 20)"  fill="url(#gill-tip-r)"/>
      <ellipse cx="59" cy="28" rx="3.5" ry="1.1" transform="rotate(8 59 28)" fill="url(#gill-tip-r)"/>
      <ellipse cx="54" cy="34" rx="3" ry="1" transform="rotate(-20 54 34)"   fill="url(#gill-tip-r)"/>
      <ellipse cx="56" cy="14" rx="2" ry="0.7" transform="rotate(55 56 14)"  fill="#F5C0D0" opacity="0.7"/>
      <ellipse cx="60" cy="23" rx="2.5" ry="0.7" transform="rotate(20 60 23)" fill="#F5C0D0" opacity="0.7"/>

      <!-- Head / face — soft warm cream with gradient -->
      <ellipse cx="32" cy="32" rx="18.5" ry="19.5" fill="url(#face-grad)" filter="url(#soft-shadow)"/>

      <!-- Cheek blush -->
      <ellipse cx="20" cy="34" rx="4" ry="2.5" fill="#F0A0B8" opacity="0.2"/>
      <ellipse cx="44" cy="34" rx="4" ry="2.5" fill="#F0A0B8" opacity="0.2"/>

      <!-- Chin / lower face -->
      <ellipse cx="32" cy="42" rx="12" ry="8.5" fill="url(#chin-grad)"/>

      <!-- Golden speckles with slight glow -->
      <circle cx="25" cy="21" r="1.3" fill="#D4A55A" opacity="0.8"/>
      <circle cx="32" cy="18" r="1.1" fill="#DAAF60" opacity="0.7"/>
      <circle cx="39" cy="21" r="1.3" fill="#D4A55A" opacity="0.8"/>
      <circle cx="28" cy="24" r="0.9" fill="#DAAF60" opacity="0.6"/>
      <circle cx="36" cy="23" r="1"   fill="#D4A55A" opacity="0.7"/>
      <circle cx="32" cy="22" r="0.7" fill="#E0BA6A" opacity="0.5"/>

      <!-- Eyes with gradient -->
      <ellipse cx="24" cy="30" rx="3.2" ry="3.4" fill="url(#eye-grad)"/>
      <ellipse cx="40" cy="30" rx="3.2" ry="3.4" fill="url(#eye-grad)"/>

      <!-- Eye highlights -->
      <circle cx="25.5" cy="28.5" r="1.2" fill="#FFFAF6" opacity="0.9"/>
      <circle cx="41.5" cy="28.5" r="1.2" fill="#FFFAF6" opacity="0.9"/>
      <circle cx="23"   cy="31"   r="0.5" fill="#FFFAF6" opacity="0.5"/>
      <circle cx="39"   cy="31"   r="0.5" fill="#FFFAF6" opacity="0.5"/>

      <!-- Nostrils -->
      <ellipse cx="29" cy="36.5" rx="0.9" ry="0.7" fill="#D9B8A8"/>
      <ellipse cx="35" cy="36.5" rx="0.9" ry="0.7" fill="#D9B8A8"/>

      <!-- Smile -->
      <path d="M27 39.5 Q29.5 42.5 32 42.5 Q34.5 42.5 37 39.5" fill="none" stroke="#D4A090" stroke-width="1" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="grid">
  <div class="icon-cell">
    <svg width="16" height="16"><use href="#axolotl-illustrated"/></svg>
    <span class="size-label">16</span>
  </div>
  <div class="icon-cell">
    <svg width="24" height="24"><use href="#axolotl-illustrated"/></svg>
    <span class="size-label">24</span>
  </div>
  <div class="icon-cell">
    <svg width="32" height="32"><use href="#axolotl-illustrated"/></svg>
    <span class="size-label">32</span>
  </div>
  <div class="icon-cell">
    <svg width="48" height="48"><use href="#axolotl-illustrated"/></svg>
    <span class="size-label">48</span>
  </div>
  <div class="icon-cell">
    <svg width="64" height="64"><use href="#axolotl-illustrated"/></svg>
    <span class="size-label">64</span>
  </div>
  <div class="icon-cell">
    <svg width="128" height="128"><use href="#axolotl-illustrated"/></svg>
    <span class="size-label">128</span>
  </div>
  <div class="icon-cell">
    <svg width="256" height="256"><use href="#axolotl-illustrated"/></svg>
    <span class="size-label">256</span>
  </div>
  <div class="icon-cell">
    <svg width="512" height="512"><use href="#axolotl-illustrated"/></svg>
    <span class="size-label">512</span>
  </div>
</div>

</body>
</html>
