<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascolotl Icon Preview — Photo-Realistic</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1E1A17;
    color: #F0EBE5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 40px 24px;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 8px;
    color: #F0EBE5;
  }
  .subtitle {
    text-align: center;
    font-size: 0.9rem;
    color: #9E958C;
    margin-bottom: 48px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: center;
    gap: 36px;
  }
  .icon-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .icon-cell .size-label {
    font-size: 0.75rem;
    color: #9E958C;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<h1>Photo-Realistic</h1>
<p class="subtitle">Simulated photographic style with realistic gradients, textures, and detail &mdash; circular crop with border</p>

<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <!-- Clip to circle -->
    <clipPath id="circle-clip">
      <circle cx="32" cy="32" r="28.5"/>
    </clipPath>

    <!-- Drop shadow for the whole icon -->
    <filter id="drop-shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Realistic gradients -->
    <radialGradient id="photo-bg" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2A1520"/>
      <stop offset="60%" stop-color="#1E1017"/>
      <stop offset="100%" stop-color="#140C10"/>
    </radialGradient>

    <!-- Skin: warm cream with subtle mottling feel -->
    <radialGradient id="skin-base" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF8F2"/>
      <stop offset="40%" stop-color="#F8E8DA"/>
      <stop offset="80%" stop-color="#F0D8C6"/>
      <stop offset="100%" stop-color="#E8CCB8"/>
    </radialGradient>
    <radialGradient id="skin-highlight" cx="45%" cy="30%" r="30%">
      <stop offset="0%" stop-color="#FFFCFA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFCFA" stop-opacity="0"/>
    </radialGradient>

    <!-- Chin: peachy salmon -->
    <radialGradient id="chin-photo" cx="50%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#F5CDB8"/>
      <stop offset="50%" stop-color="#EEBEA5"/>
      <stop offset="100%" stop-color="#E0AC90"/>
    </radialGradient>

    <!-- Gill gradients — realistic feathery look -->
    <linearGradient id="gill-photo-l1" x1="0%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#B03060"/>
      <stop offset="35%" stop-color="#D94F7A"/>
      <stop offset="70%" stop-color="#E87098"/>
      <stop offset="100%" stop-color="#F0A0B8"/>
    </linearGradient>
    <linearGradient id="gill-photo-r1" x1="100%" y1="20%" x2="20%" y2="80%">
      <stop offset="0%" stop-color="#B03060"/>
      <stop offset="35%" stop-color="#D94F7A"/>
      <stop offset="70%" stop-color="#E87098"/>
      <stop offset="100%" stop-color="#F0A0B8"/>
    </linearGradient>
    <linearGradient id="gill-photo-l2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#C44070"/>
      <stop offset="100%" stop-color="#F0B0C4"/>
    </linearGradient>
    <linearGradient id="gill-photo-r2" x1="90%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#C44070"/>
      <stop offset="100%" stop-color="#F0B0C4"/>
    </linearGradient>

    <!-- Eye realistic gradient -->
    <radialGradient id="eye-photo" cx="42%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#2A2520"/>
      <stop offset="70%" stop-color="#1A1512"/>
      <stop offset="100%" stop-color="#100E0C"/>
    </radialGradient>

    <!-- Subtle noise texture -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray-noise"/>
      <feBlend in="SourceGraphic" in2="gray-noise" mode="soft-light"/>
    </filter>

    <!-- Subtle inner glow for gills -->
    <filter id="gill-soft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.4"/>
    </filter>

    <symbol id="axolotl-photo" viewBox="0 0 64 64">
      <g>
        <!-- Background circle — flat dark gray -->
        <circle cx="32" cy="32" r="30" fill="#2E2E2E"/>

        <!-- Clipped content area -->
        <g clip-path="url(#circle-clip)">

          <!-- LEFT GILLS — realistic layered feathery branches -->
          <!-- Thick base branches -->
          <path d="M17 28 Q10 22 6 16" stroke="url(#gill-photo-l1)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M16 32 Q8 28 3 24" stroke="url(#gill-photo-l1)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
          <path d="M17 36 Q10 35 5 32" stroke="url(#gill-photo-l1)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <!-- Thinner sub-branches -->
          <path d="M14 25 Q9 18 7 12" stroke="url(#gill-photo-l2)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M13 30 Q6 26 2 21" stroke="url(#gill-photo-l2)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M15 34 Q8 33 4 29" stroke="url(#gill-photo-l2)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <!-- Fine tips -->
          <path d="M11 22 Q7 16 5 10" stroke="#F0A0B8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>
          <path d="M9 28 Q4 24 1 19" stroke="#F0A0B8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
          <path d="M12 37 Q7 37 3 35" stroke="#F0A0B8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
          <!-- Tiny filaments -->
          <path d="M8 19 Q5 14 4 9" stroke="#F5C0D0" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.5"/>
          <path d="M6 25 Q3 21 1 17" stroke="#F5C0D0" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.4"/>

          <!-- RIGHT GILLS — mirrored -->
          <path d="M47 28 Q54 22 58 16" stroke="url(#gill-photo-r1)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
          <path d="M48 32 Q56 28 61 24" stroke="url(#gill-photo-r1)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
          <path d="M47 36 Q54 35 59 32" stroke="url(#gill-photo-r1)" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M50 25 Q55 18 57 12" stroke="url(#gill-photo-r2)" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M51 30 Q58 26 62 21" stroke="url(#gill-photo-r2)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M49 34 Q56 33 60 29" stroke="url(#gill-photo-r2)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <path d="M53 22 Q57 16 59 10" stroke="#F0A0B8" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>
          <path d="M55 28 Q60 24 63 19" stroke="#F0A0B8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
          <path d="M52 37 Q57 37 61 35" stroke="#F0A0B8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.6"/>
          <path d="M56 19 Q59 14 60 9" stroke="#F5C0D0" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.5"/>
          <path d="M58 25 Q61 21 63 17" stroke="#F5C0D0" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.4"/>

          <!-- Head / face — realistic layered rendering -->
          <ellipse cx="32" cy="33" rx="18" ry="19" fill="url(#skin-base)"/>
          <!-- Highlight overlay -->
          <ellipse cx="32" cy="33" rx="18" ry="19" fill="url(#skin-highlight)"/>

          <!-- Chin area — warm salmon -->
          <ellipse cx="32" cy="43" rx="12.5" ry="8.5" fill="url(#chin-photo)"/>
          <!-- Chin highlight -->
          <ellipse cx="32" cy="40" rx="8" ry="4" fill="#FFF8F2" opacity="0.12"/>

          <!-- Subtle edge shadow on face -->
          <ellipse cx="32" cy="33" rx="18" ry="19" fill="none" stroke="#C8A890" stroke-width="1.5" opacity="0.15"/>

          <!-- Golden speckles — realistic scattered spots -->
          <circle cx="25" cy="22" r="1.4" fill="#CDA050" opacity="0.55"/>
          <circle cx="31" cy="19" r="1.1" fill="#D4A858" opacity="0.5"/>
          <circle cx="38" cy="21" r="1.3" fill="#CDA050" opacity="0.55"/>
          <circle cx="28" cy="25" r="0.9" fill="#D8B060" opacity="0.4"/>
          <circle cx="35" cy="24" r="1"   fill="#CDA050" opacity="0.45"/>
          <circle cx="33" cy="21" r="0.7" fill="#D8B060" opacity="0.35"/>
          <circle cx="27" cy="20" r="0.6" fill="#D8B060" opacity="0.3"/>
          <circle cx="37" cy="24" r="0.6" fill="#D8B060" opacity="0.3"/>

          <!-- Eyes — deep dark with realistic shine -->
          <ellipse cx="24" cy="31" rx="3.3" ry="3.6" fill="url(#eye-photo)"/>
          <ellipse cx="40" cy="31" rx="3.3" ry="3.6" fill="url(#eye-photo)"/>
          <!-- Eye ring (subtle iris edge) -->
          <ellipse cx="24" cy="31" rx="3.3" ry="3.6" fill="none" stroke="#1A1512" stroke-width="0.5" opacity="0.3"/>
          <ellipse cx="40" cy="31" rx="3.3" ry="3.6" fill="none" stroke="#1A1512" stroke-width="0.5" opacity="0.3"/>
          <!-- Primary highlights -->
          <ellipse cx="25.8" cy="29.5" rx="1.4" ry="1.1" fill="#FFFCFA" opacity="0.85"/>
          <ellipse cx="41.8" cy="29.5" rx="1.4" ry="1.1" fill="#FFFCFA" opacity="0.85"/>
          <!-- Secondary highlights -->
          <circle cx="22.8" cy="32.2" r="0.6" fill="#FFFCFA" opacity="0.4"/>
          <circle cx="38.8" cy="32.2" r="0.6" fill="#FFFCFA" opacity="0.4"/>

          <!-- Nostrils -->
          <ellipse cx="29" cy="37" rx="1" ry="0.75" fill="#D0A898" opacity="0.7"/>
          <ellipse cx="35" cy="37" rx="1" ry="0.75" fill="#D0A898" opacity="0.7"/>

          <!-- Mouth line — subtle, realistic -->
          <path d="M27.5 40 Q29.8 42.8 32 43 Q34.2 42.8 36.5 40" fill="none" stroke="#C8A090" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>

        </g>

        <!-- Circular border ring -->
        <circle cx="32" cy="32" r="29.2" fill="none" stroke="#D94F7A" stroke-width="2"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="grid">
  <div class="icon-cell">
    <svg width="16" height="16"><use href="#axolotl-photo"/></svg>
    <span class="size-label">16</span>
  </div>
  <div class="icon-cell">
    <svg width="24" height="24"><use href="#axolotl-photo"/></svg>
    <span class="size-label">24</span>
  </div>
  <div class="icon-cell">
    <svg width="32" height="32"><use href="#axolotl-photo"/></svg>
    <span class="size-label">32</span>
  </div>
  <div class="icon-cell">
    <svg width="48" height="48"><use href="#axolotl-photo"/></svg>
    <span class="size-label">48</span>
  </div>
  <div class="icon-cell">
    <svg width="64" height="64"><use href="#axolotl-photo"/></svg>
    <span class="size-label">64</span>
  </div>
  <div class="icon-cell">
    <svg width="128" height="128"><use href="#axolotl-photo"/></svg>
    <span class="size-label">128</span>
  </div>
  <div class="icon-cell">
    <svg width="256" height="256"><use href="#axolotl-photo"/></svg>
    <span class="size-label">256</span>
  </div>
  <div class="icon-cell">
    <svg width="512" height="512"><use href="#axolotl-photo"/></svg>
    <span class="size-label">512</span>
  </div>
</div>

</body>
</html>
